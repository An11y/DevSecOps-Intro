apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  podSelector:
    matchLabels:
      app: juice-shop
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Minimum reopen: HTTP to the app from pods that opt in with access=juice-shop-client
    - from:
        - podSelector:
            matchLabels:
              access: juice-shop-client
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS to kube-system CoreDNS only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
